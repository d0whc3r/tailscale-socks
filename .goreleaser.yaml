# Release pipeline for a tag push. One matrix, one place: CI runs
# `goreleaser release`, `make release` runs the same as a snapshot.
version: 2

builds:
  - id: tailscale-socks
    main: ./cmd/tailscale-socks
    binary: tailscale-socks
    # Static and stripped, same as the old `make release` matrix. No
    # `-X main.version`: the version comes from the VCS tag through
    # debug.ReadBuildInfo, which -trimpath leaves intact.
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    # The two darwin targets exist only to be lipo'd into the universal one.
    targets: [darwin_amd64, darwin_arm64, linux_amd64, windows_amd64]

# One binary for every Mac, instead of one per architecture. `replace: true`
# drops the per-architecture darwin builds: nothing else consumes them.
universal_binaries:
  - id: universal
    ids: [tailscale-socks]
    replace: true

# One archive per platform, and nothing else: no .deb, no installer. It is
# what `contrib/install.sh` unpacks and what `tailscale-socks upgrade`
# replaces itself from, so the name carries no version and
# `releases/latest/download/<name>` is a stable URL.
archives:
  - id: tailscale-socks
    formats: [tar.gz]
    # zip on Windows, where Explorer opens one and tar.gz needs a terminal.
    format_overrides:
      - goos: windows
        formats: [zip]
    # No architecture for darwin: that binary is universal.
    name_template: '{{ .ProjectName }}-{{ .Os }}-{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}'
    # The same payload everywhere, including all three zsh backends: six
    # kilobytes, and it keeps every archive the same shape.
    files:
      # A literal src takes the full destination path; only a glob treats
      # dst as a directory.
      - src: contrib/tailscale-socks.zsh
        dst: contrib/tailscale-socks.zsh
      - src: contrib/platform/*.zsh
        dst: contrib/platform
      - .env.example
      - README.md
      - LICENSE
      - src: docs/*.md
        dst: docs

checksum:
  name_template: SHA256SUMS.txt

# Release notes grouped by conventional commit type. Anything that is not
# feat/fix/perf lands in Other; docs, tests and chores are dropped.
changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?!?:'
      - '^test(\(.+\))?!?:'
      - '^chore(\(.+\))?!?:'
      - '^ci(\(.+\))?!?:'
      - '^style(\(.+\))?!?:'
      - '^refactor(\(.+\))?!?:'
      - '^Merge '

# Pinned instead of inferred from the git remote, so `goreleaser check` and the
# local snapshot work in a clone that has no origin.
release:
  github:
    owner: d0whc3r
    name: tailscale-socks
