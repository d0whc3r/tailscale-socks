version: 2

updates:
  # Direct Go dependencies. Everything else in go.mod is transitive from
  # tailscale.com and moves when tailscale.com does.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the routine bumps; majors stay separate so they get read.
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
