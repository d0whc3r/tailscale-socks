name: go
description: Install the module's Go toolchain and restore this job's build cache.

runs:
  using: composite
  steps:
    # Modules only. setup-go keys that cache on go.sum, which is exactly right
    # for a module cache and exactly wrong for a build cache.
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    # The build cache gets its own entry, keyed by job. setup-go writes its
    # bundle only on a miss, so the first job to finish under a given go.sum
    # froze the build cache for every run after it: `vuln` won that race and
    # left the gate recompiling tailscale.com for vet and again for -race, 128s
    # of the 152s `make check` took. A vet fact, a -race object and a plain
    # archive are three different build profiles, so each job keeps its own and
    # cannot overwrite what another one depends on.
    #
    # go-build carries the test cache too, so an unchanged package reports
    # `(cached)` instead of running again, including under -coverprofile.
    #
    # No run_id in the key, deliberately. Rotating per run meant re-uploading
    # the whole cache every time — 39s of a 78s job — and it grew unbounded,
    # since each run appended to what it restored and saved the sum. Keyed on
    # the two files that decide what is in it instead: go.sum for the
    # dependency tree, go.mod for the toolchain that compiled it, both of which
    # invalidate stale entries when they move. An exact hit skips the upload
    # entirely; a miss falls back to the newest entry for the job and re-saves.
    - uses: actions/cache@v6
      with:
        path: ~/.cache/go-build
        key: go-build-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: go-build-${{ github.job }}-
