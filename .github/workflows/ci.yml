name: ci

on:
  # Branch only. A tag never starts a run: the one the `tag` job creates is
  # pushed with GITHUB_TOKEN, which deliberately triggers nothing, and letting
  # a hand-pushed tag in as well would mean two runs racing to release the
  # same commit.
  push:
    branches: [main]
  pull_request:
  # govulncheck has to catch advisories published after the last commit.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

# A second push to a pull request supersedes the run in flight. Never on main:
# every commit there has to reach `tag`, so those runs queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `make check` split three ways. The halves are independent and were costing
# their sum in one job; in parallel the gate costs the slowest of them. `lint`,
# `test` and `shell` together are `check` plus `build` — the local gate is
# still the single `make check`.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
      - run: make lint
      # Here rather than with `test`, to balance the two Go jobs: this one is
      # the shorter, and linking the binary is the one thing `go test` skips.
      - run: make build

  # One `make cover` and not `make test` before it: cover carries -race too, so
  # it is the whole test run plus the profile. Two targets meant compiling
  # tailscale.com twice into two cache profiles for the same result.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
      # Coverage lands in the run summary, so every push and pull request shows
      # the number without an external service, a token or a third-party action.
      - name: test and coverage
        run: |
          make cover
          {
            echo "### Coverage: $(go tool cover -func=coverage/cover.out | tail -1 | awk '{print $NF}')"
            echo
            echo '<details><summary>per function</summary>'
            echo
            echo '```'
            go tool cover -func=coverage/cover.out
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  # No Go at all: the zsh suite is the one part of the gate that never builds
  # the module, so it skips the toolchain and runs while the other two compile.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Neither is on the runner image. Ubuntu 24.04 packages bats 1.10, past
      # the 1.5.0 the suite needs, so one apt call replaces the clone that
      # used to build it from source; `bats_require_minimum_version` in
      # contrib/test/helpers.bash is what fails if a runner ever ships older.
      - name: shell toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh bats
      - run: make test-sh

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
      - run: make vuln

  # The conventional commits since the last tag decide the next version:
  # breaking change major, feat minor, fix and perf patch, anything else no
  # release at all. Tagging here rather than in a hook means no tag ever points
  # at a commit the gate rejected. Gated on the three gate jobs, not on `vuln`:
  # govulncheck needs the network and must not block a release.
  #
  # push=false means HEAD already carries the tag, so `release` runs and
  # nothing is created. That is what makes re-running a failed release work:
  # the second pass finds the tag from the first and does not try to push it
  # again.
  tag:
    if: github.event_name == 'push'
    needs: [lint, test, shell]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes to main in a row would otherwise race to create the same tag.
    concurrency:
      group: tag
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      # Full history: the bump is read from the log since the last tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: packaging/next-version.sh >> "$GITHUB_OUTPUT"
      - name: create tag
        if: steps.next.outputs.push == 'true'
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  # GoReleaser builds the matrix in .goreleaser.yaml, writes SHA256SUMS.txt and
  # publishes the release with notes grouped by conventional commit type. It
  # hangs off the `tag` job rather than off a tag push, because a tag pushed
  # with GITHUB_TOKEN deliberately does not start a workflow.
  #
  # Nothing in the matrix needs a macOS runner: the release is archives, and
  # the Go toolchain cross-builds every target. That is also why macOS ships an
  # archive and not a .pkg — only Xcode's pkgbuild can produce one, and
  # Gatekeeper would block it unsigned anyway.
  release:
    if: needs.tag.outputs.tag != ''
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag, not the branch: the version in the binary comes from it via
      # ReadBuildInfo, and GoReleaser refuses to release an untagged HEAD. Full
      # history because the changelog reads back to the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      - uses: ./.github/actions/go
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
