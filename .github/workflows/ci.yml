name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # govulncheck has to catch advisories published after the last commit.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make build
      # Coverage lands in the run summary, so every push and pull request shows
      # the number without an external service, a token or a third-party action.
      - name: coverage
        run: |
          make cover
          {
            echo "### Coverage: $(go tool cover -func=coverage/cover.out | tail -1 | awk '{print $NF}')"
            echo
            echo '<details><summary>per function</summary>'
            echo
            echo '```'
            go tool cover -func=coverage/cover.out
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make vuln

  # Tag push only: the same matrix `make release` builds locally, attached to
  # the GitHub release. Gated on `check`, not `vuln`: govulncheck needs the
  # network and must not block a tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make release
      - name: checksums
        working-directory: dist
        run: sha256sum tailscale-socks-* > SHA256SUMS.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
