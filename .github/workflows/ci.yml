name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # govulncheck has to catch advisories published after the last commit.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # zsh is not on the runner image, and the packaged bats is older than
      # the 1.5.0 the suite needs. Pinned to the version the tests were
      # written against, like every other tool here.
      - name: shell toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
      - run: make check
      - run: make build
      # Coverage lands in the run summary, so every push and pull request shows
      # the number without an external service, a token or a third-party action.
      - name: coverage
        run: |
          make cover
          {
            echo "### Coverage: $(go tool cover -func=coverage/cover.out | tail -1 | awk '{print $NF}')"
            echo
            echo '<details><summary>per function</summary>'
            echo
            echo '```'
            go tool cover -func=coverage/cover.out
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make vuln

  # Tag push only: GoReleaser builds the matrix in .goreleaser.yaml, writes
  # SHA256SUMS.txt and publishes the release with notes grouped by conventional
  # commit type. Gated on `check`, not `vuln`: govulncheck needs the network and
  # must not block a tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: GoReleaser reads the previous tag to build the changelog,
      # and the version in the binary comes from the tag via ReadBuildInfo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
